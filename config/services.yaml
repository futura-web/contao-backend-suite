services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            Imagine\Image\ImagineInterface: '@contao.image.imagine'
            Symfony\Component\Filesystem\Filesystem: '@filesystem'

    Futuraweb\ContaoBackendSuite\:
        resource: '../src/'
        exclude:
            - '../src/ContaoManager/'
            - '../src/DependencyInjection/'
            - '../src/ContaoBackendSuiteBundle.php'
