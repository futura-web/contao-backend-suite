services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            Imagine\Image\ImagineInterface: '@contao.image.imagine'
            Symfony\Component\Filesystem\Filesystem: '@filesystem'

    Futuraweb\ContaoBackendSuite\:
        resource: '../src/'
        exclude:
            - '../src/ContaoManager/'
            - '../src/DependencyInjection/'
            - '../src/ContaoBackendSuiteBundle.php'

    # Public, da projektseitiger Legacy-DCA-Code (z.B. tl_theme.php in
    # c5.futura-web.de) ihn direkt über System::getContainer()->get(...)
    # abruft statt per Konstruktor-Injection - ohne "public: true" wird ein
    # nur intern verwendeter Service vom Container wegoptimiert/inlined und
    # ist dann ueber get() nicht mehr erreichbar.
    Futuraweb\ContaoBackendSuite\ThemeFontColor\ColorImporter:
        public: true
